events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11;
    keepalive_timeout 65;

    lua_shared_dict domain_cache 10m;

    # The page template lives in unregistered.lua; nginx parses inline Lua
    # blocks with a small (8 KB) config buffer, which is too small for it.
    init_by_lua_file /usr/local/openresty/nginx/conf/unregistered.lua;

    server {
        listen 80;
        server_name _;

        location / {

            set $target_backend "";
            set $target_scheme "http";

            rewrite_by_lua_block {
                local host = ngx.var.host
                local cache = ngx.shared.domain_cache

                -- Routing values are resolved per host and applied to this
                -- request. Formats: "host:port" (http upstream),
                -- "https://host:port" (https upstream) or "r:url" (redirect).
                -- Plain locals are used instead of nginx variables for the
                -- redirect, because ngx_http_rewrite_module directives like
                -- `if` always run BEFORE this Lua handler.
                local target_backend = ""
                local target_scheme = "http"
                local redirect_url = ""

                local function apply_target(target)
                    if string.sub(target, 1, 2) == "r:" then
                        redirect_url = string.sub(target, 3)
                    elseif string.sub(target, 1, 8) == "https://" then
                        target_scheme = "https"
                        target_backend = string.sub(target, 9)
                    else
                        target_backend = target
                    end
                    ngx.ctx.route_found = true
                end

                local cached_target = cache:get(host)
                if cached_target then
                    apply_target(cached_target)
                else
                    local redis = require "resty.redis"
                    local red = redis:new()
                    red:set_timeout(1000)

                    local ok = red:connect("redis", 6379)
                    if not ok then
                        return ngx.exit(500)
                    end

                    local banned, banned_err = red:get("banned:" .. host)
                    if banned_err then
                        red:set_keepalive(10000, 100)
                        return ngx.exit(500)
                    end

                    if banned and banned ~= ngx.null then
                        red:set_keepalive(10000, 100)

                        local conf = domainak_banned
                        local page = domainak_render(conf.page, {
                            host = domainak_escape_html(host),
                            app_url = conf.app_url,
                            app_host = conf.app_host,
                            reason_html = domainak_banned_reason_html(banned),
                        })

                        ngx.status = 403
                        ngx.header["Content-Type"] = "text/html; charset=utf-8"
                        ngx.header["Cache-Control"] = "no-store"
                        ngx.print(page)
                        return ngx.exit(403)
                    end

                    local res = red:get(host)

                    -- Anything without a real routing value (nil, redis null,
                    -- empty string) is an unregistered host: serve the claim
                    -- page and never mark the request as countable. Only
                    -- registered routes reach apply_target(), which sets
                    -- route_found and enables visit counting downstream.
                    if not res or res == ngx.null or res == "" then
                        red:set_keepalive(10000, 100)

                        local conf = domainak_unregistered
                        local claim_url = conf.app_url
                            .. "/?subdomain=" .. ngx.escape_uri(host)

                        local page = domainak_render(conf.page, {
                            host = domainak_escape_html(host),
                            app_url = conf.app_url,
                            app_host = conf.app_host,
                            claim_url = domainak_escape_html(claim_url),
                        })

                        ngx.status = 404
                        ngx.header["Content-Type"] = "text/html; charset=utf-8"
                        ngx.header["Cache-Control"] = "no-store"
                        ngx.print(page)
                        return ngx.exit(404)
                    end

                    cache:set(host, res, 30)
                    red:set_keepalive(10000, 100)
                    apply_target(res)
                end

                -- The redirect is issued from Lua because `if` directives
                -- evaluate before this handler runs and would never see the
                -- resolved target.
                if redirect_url ~= "" then
                    return ngx.redirect(redirect_url)
                end

                if target_backend == "" then
                    return ngx.exit(502)
                end

                ngx.var.target_scheme = target_scheme
                ngx.var.target_backend = target_backend
            }

            proxy_pass $target_scheme://$target_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;

            # Decide per response whether it counts as one "visit". Assets,
            # API calls and non-browser clients are excluded so the counters
            # no longer explode; the log phase only records flagged requests.
            header_filter_by_lua_block {
                if not ngx.ctx.route_found then
                    return
                end

                local method = ngx.req.get_method()
                if method ~= "GET" and method ~= "HEAD" then
                    return
                end

                -- Only count browser document navigations. Browsers send
                -- Sec-Fetch-Dest on every request; as a fallback for older
                -- clients, look for an HTML accept header.
                local request_headers = ngx.req.get_headers()
                local sec_fetch_dest = request_headers["sec-fetch-dest"]
                local is_document = false
                if sec_fetch_dest then
                    is_document = sec_fetch_dest == "document"
                elseif request_headers["accept"] then
                    is_document = string.find(
                        request_headers["accept"],
                        "text/html",
                        1,
                        true
                    ) ~= nil
                end

                if not is_document then
                    return
                end

                -- One visit per host per browser per day (cookie dedupe).
                local today = os.date("!%Y-%m-%d")
                if ngx.var.cookie_domainak_visit == today then
                    return
                end

                ngx.ctx.domainak_count = true

                -- Append the cookie without dropping backend cookies.
                -- HttpOnly keeps it out of document.cookie, because some
                -- upstream apps compare document.cookie against an exact
                -- string and would break when our cookie appears there.
                local cookie = "domainak_visit=" .. today
                    .. "; Path=/; Max-Age=86400; SameSite=Lax; HttpOnly"
                local existing = ngx.header["Set-Cookie"]
                if existing then
                    if type(existing) == "table" then
                        table.insert(existing, cookie)
                    else
                        existing = { existing, cookie }
                    end
                    ngx.header["Set-Cookie"] = existing
                else
                    ngx.header["Set-Cookie"] = cookie
                end
            }

            log_by_lua_block {
                if not ngx.ctx.domainak_count then
                    return
                end

                local tracked_host = ngx.var.host
                local ok_timer, timer_err = ngx.timer.at(0, function(premature, tracked_host)
                    if premature or not tracked_host or tracked_host == "" then
                        return
                    end

                    local redis = require "resty.redis"
                    local red = redis:new()
                    red:set_timeout(1000)

                    local ok, connect_err = red:connect("redis", 6379)
                    if not ok then return end

                    local now = ngx.time()
                    local year  = os.date("!%Y", now)
                    local month = os.date("!%m", now)
                    local day   = os.date("!%d", now)
                    -- %G/%V form the ISO week-numbering year and week so
                    -- early-January dates land on the correct week key.
                    local iso_year = string.format(
                        "%04d",
                        tonumber(os.date("!%G", now)) or 0
                    )
                    local week = string.format(
                        "%02d",
                        tonumber(os.date("!%V", now)) or 0
                    )

                    local total_key = tracked_host .. ":total"
                    local year_key = tracked_host .. ":" .. year
                    local month_key = tracked_host .. ":" .. year .. "-" .. month
                    local weekly_key = tracked_host .. ":" .. iso_year .. "-W" .. week
                    local daily_key = tracked_host .. ":" .. year .. "-" .. month .. "-" .. day

                    -- ARGV[i] is the TTL for KEYS[i]; "0" keeps the key forever
                    -- (total/year/month must survive for historical views).
                    local analytics_script = [[
                        for i = 1, #KEYS do
                            redis.call("INCR", KEYS[i])
                            if redis.call("TTL", KEYS[i]) < 0
                                and ARGV[i] ~= "0" then
                                redis.call("EXPIRE", KEYS[i], tonumber(ARGV[i]))
                            end
                        end
                        return 1
                    ]]

                    local ok_eval, eval_err = red:eval(
                        analytics_script,
                        5,
                        total_key,
                        year_key,
                        month_key,
                        weekly_key,
                        daily_key,
                        0,
                        0,
                        0,
                        691200,
                        172800
                    )

                    if not ok_eval then
                        ngx.log(ngx.ERR, "analytics increment failed: ", eval_err)
                    end

                    red:set_keepalive(10000, 100)
                end, tracked_host)

                if not ok_timer then
                    ngx.log(ngx.ERR, "failed to create analytics timer: ", timer_err)
                end
            }
        }
    }
}
