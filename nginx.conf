      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        padding: 0 24px;
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.18s ease, box-shadow 0.18s ease,
          background 0.18s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, #67e8f9, #22d3ee);
        color: #062a33;
        box-shadow: 0 10px 26px rgba(34, 211, 238, 0.28);
      }

      .btn-primary:hover,
      .btn-primary:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 14px 32px rgba(34, 211, 238, 0.36);
      }

      .btn-ghost {
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .btn-ghost:hover,
      .btn-ghost:focus-visible {
        color: var(--text);
        border-color: var(--accent);
      }

      .steps {
        display: grid;
        gap: 10px;
        margin: 26px 0 0;
        padding: 22px 0 0;
        border-top: 1px solid var(--border);
        list-style: none;
      }

      .steps li {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .step-index {
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 700;
      }

      .steps b {
        color: var(--text);
        font-weight: 600;
      }

      footer {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
      }

      footer a {
        color: inherit;
        text-decoration: none;
      }

      footer a:hover,
      footer a:focus-visible {
        color: var(--accent);
      }

      @media (max-width: 560px) {
        .card {
          padding: 24px 20px;
        }

        h1 {
          font-size: 1.7rem;
        }

        .actions .btn {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="card">
        <a class="brand" href="@@app_url@@">
          <span class="mark" aria-hidden="true">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18" />
              <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18" />
            </svg>
          </span>
          <span>
            <span class="brand-name">Domainak</span>
            <span class="brand-sub">routing control</span>
          </span>
        </a>

        <div class="badge">
          <span class="badge-dot" aria-hidden="true"></span>
          404 · no route
        </div>

        <h1>This subdomain isn&rsquo;t claimed yet.</h1>
        <p class="lede">
          <strong>@@host@@</strong> is not registered on Domainak, so there is
          no destination behind it. Reserve the name, point it at your server
