        </p>

        <div class="field">
          <span class="field-host" id="host">@@host@@</span>
          <button
            class="copy"
            type="button"
            data-copy="@@host@@"
            data-copy-label
          >
            Copy
          </button>
        </div>

        <div class="actions">
          <a class="btn btn-primary" href="@@claim_url@@">
            Reserve this subdomain
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14" />
              <path d="m13 6 6 6-6 6" />
            </svg>
          </a>
          <a class="btn btn-ghost" href="@@app_url@@">
            Go to @@app_host@@
          </a>
        </div>

        <ol class="steps">
          <li>
            <span class="step-index">1</span>
            <span>Sign in with GitHub to open your workspace.</span>
          </li>
          <li>
            <span class="step-index">2</span>
            <span>
              Claim <b>@@host@@</b> and enter a destination host and port, or a
              redirect target.
            </span>
          </li>
          <li>
            <span class="step-index">3</span>
            <span>Domainak proxies the hostname, with traffic stats per route.</span>
          </li>
        </ol>
      </div>

      <footer>
        Served by Domainak ·
        <a href="https://github.com/z44d">github.com/z44d</a>
      </footer>
    </main>

    <script>
      (function () {
        var button = document.querySelector("[data-copy]");
        if (!button) {
          return;
        }

        var value = button.getAttribute("data-copy") || "";
        var label = button.querySelector("[data-copy-label]");
        var original = label ? label.textContent : "";

        function announce(ok) {
          if (!label) {
            return;
          }
          label.textContent = ok ? "Copied" : "Ctrl+C";
          window.setTimeout(function () {
            label.textContent = original;
          }, 1600);
        }

        button.addEventListener("click", function () {
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(value).then(
              function () {
                announce(true);
              },
              function () {
                announce(false);
              },
            );
            return;
          }

          var field = document.createElement("textarea");
          field.value = value;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();

          try {
            announce(document.execCommand("copy"));
          } catch (error) {
            announce(false);
          }

          document.body.removeChild(field);
        });
      })();
    </script>
  </body>
</html>
